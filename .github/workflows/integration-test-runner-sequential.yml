name: Integration Test Runner (Sequential - All Tests)
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Enter PR link (ex: https://github.com/wso2-extensions/identity-inbound-auth-oauth/pull/1481)"
        default:
        required: true

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Djdk.util.zip.disableZip64ExtraFieldValidation=true -XX:+HeapDumpOnOutOfMemoryError

jobs:
  run-all-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Print Input
        run: echo "Running all tests sequentially for PR - ${{ github.event.inputs.pr }}"
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Set up Maven 3.9.x
        # Maven 3.10.0 (ubuntu-latest image 20261004+) breaks the Tycho-based carbon-p2-plugin.
        run: |
          MAVEN_VERSION=3.9.11
          MAVEN_SHA512=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          MAVEN_ARCHIVE="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "$MAVEN_ARCHIVE" https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz
          echo "${MAVEN_SHA512}  ${MAVEN_ARCHIVE}" | sha512sum -c -
          tar -xzf "$MAVEN_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" --version
      - name: Echo java 21 home
        run: |
          echo "J21HOME=$JAVA_HOME" >> ${GITHUB_ENV}
        id: java-21-setup
      - name: Build init
        run: |
          echo "CURRENT_MONTH=$(date +%Y-%m)" >> ${GITHUB_ENV}
      - name: Cache maven packages
        id: cache-maven-m2
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            !~/.m2/repository/org/wso2/is/wso2is
          key: ${{ runner.os }}-pr-builder-sequential-${{ env.CURRENT_MONTH }}
      - name: Setup pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false
      - name: Run PR builder (all tests)
        id: builder_step
        env:
          PR_LINK: ${{github.event.inputs.pr}}
          JAVA_21_HOME: ${{env.J21HOME}}
        run: |
          bash .github/scripts/pr-builder.sh 1 ""
      - name: Archive PR diff file
        uses: actions/upload-artifact@v4
        with:
          name: repo-pr-diff
          path: |
            ${{steps.builder_step.outputs.REPO_NAME}}/diff.diff
          if-no-files-found: warn
      - name: Archive repo mvn build log
        if: ${{ steps.builder_step.outputs.REPO_NAME != 'product-is' }}
        uses: actions/upload-artifact@v4
        with:
          name: repo-mvn-build-log
          path: |
            ${{steps.builder_step.outputs.REPO_NAME}}/mvn-build.log
          if-no-files-found: warn
      - name: Archive product-is mvn build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-is-mvn-build-log
          path: |
            product-is-1/mvn-build.log
          if-no-files-found: warn
      - name: Archive product-is surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-is-surefire-report
          path: |
            product-is-1/**/surefire-reports
          if-no-files-found: warn
      - name: Archive heap dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heap-dump
          path: |
            **/**.hprof
          if-no-files-found: ignore

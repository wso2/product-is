# This workflow will update dependencies for product-is next branch.
name: Dependency Updater (Next Branch)
on:
  workflow_dispatch:
  schedule:
    # Everyday at 15:00 UTC (8.30 PM SL time)
    - cron:  '0 15 * * *'

env:
  MAVEN_OPTS: -Xmx4g -Xms1g -XX:+HeapDumpOnOutOfMemoryError
  REPOSITORY: product-is
  GIT_USERNAME: jenkins-is-staging
  GIT_EMAIL: jenkins-is-staging@wso2.com
  PRODUCT_REPOSITORY_FORKED: $GIT_USERNAME'/'${REPOSITORY}
  REMOTE_PRODUCT_REPOSITORY_PUBLIC: wso2/$REPOSITORY
  PRODUCT_REPOSITORY_PUBLIC: wso2/$REPOSITORY
  BUILD_NUMBER: ${{github.run_id}}
  DEPENDENCY_UPGRADE_BRANCH_NAME: IS_dependency_updater_next_github_action/$BUILD_NUMBER
  PR: "https://github.com/wso2/product-is/pulls"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Adopt JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "adopt"
      - name: Set up Maven 3.9.x
        # Maven 3.10.0 (ubuntu-latest image 20261004+) breaks the Tycho-based carbon-p2-plugin.
        run: |
          MAVEN_VERSION=3.9.11
          MAVEN_SHA512=bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
          MAVEN_ARCHIVE="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "$MAVEN_ARCHIVE" https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz
          echo "${MAVEN_SHA512}  ${MAVEN_ARCHIVE}" | sha512sum -c -
          tar -xzf "$MAVEN_ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" --version
      - name: Check $JAVA_HOME
        run: |
          echo $JAVA_HOME
      - name: Cache local Maven repository
        id: cache-maven-m2
        uses: actions/cache@v4
        env:
          cache-name: cache-m2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.cache-name }}-
            ${{ runner.os }}-maven-
            ${{ runner.os }}-
      - name: Clone Repository
        id: builder_step
        run: |
          echo "REPO_NAME=${{ env.REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "Starting dependency upgrade"
          echo "=========================================================="
          echo "Clean up any existing files"
          echo "=========================================================="
          rm -rf ${{ env.REPOSITORY }}
          echo "Cloning: https://github.com/'${{ env.PRODUCT_REPOSITORY_FORKED }}"
          echo "=========================================================="
          git clone 'https://github.com/'${{ env.PRODUCT_REPOSITORY_FORKED }}'.git'
          cd ${{ env.REPOSITORY }}
          echo 'Add remote: '${{ env.REMOTE_PRODUCT_REPOSITORY_PUBLIC }} 'as https://github.com/'${{ env.PRODUCT_REPOSITORY_PUBLIC }}
          echo "=========================================================="
          git remote add ${{ env.REMOTE_PRODUCT_REPOSITORY_PUBLIC }} 'https://@github.com/'${{ env.PRODUCT_REPOSITORY_PUBLIC }}
          echo "Fetching: ${{ env.REMOTE_PRODUCT_REPOSITORY_PUBLIC }}"
          echo "=========================================================="
          git fetch ${{ env.REMOTE_PRODUCT_REPOSITORY_PUBLIC }}
          echo "Checking out: ${{ env.REMOTE_PRODUCT_REPOSITORY_PUBLIC }} next branch"
          echo "=========================================================="
          git checkout -b ${{ env.DEPENDENCY_UPGRADE_BRANCH_NAME }} ${{ env.REMOTE_PRODUCT_REPOSITORY_PUBLIC }}'/next'

      - name: Update Dependencies
        working-directory: ${{ env.REPOSITORY }}
        run: |
          echo "Updating dependencies"
          echo "=========================================================="
          mvn versions:update-properties -U -DgenerateBackupPoms=false -DallowMajorUpdates=false -DallowMinorUpdates=false -Dincludes=org.wso2.carbon.identity.*,org.wso2.carbon.extension.identity.*,org.wso2.identity.*,org.wso2.carbon.consent.*,org.wso2.carbon.healthcheck,org.wso2.carbon.analytics-common,org.wso2.charon,org.apache.rampart.wso2,org.apache.ws.security.wso2,org.wso2.carbon.identity.framework:*,org.wso2.carbon.multitenancy:*,org.wso2.carbon.registry:* -Dexcludes=org.wso2.carbon.extension.identity.authenticator.utils
          echo "Updating identity-apps versions"
          echo "=========================================================="
          # The identity-apps features roll to a new minor line on each console release, so they are
          # updated with minor updates allowed. The run above keeps every other dependency on its line.
          mvn versions:update-properties -U -DgenerateBackupPoms=false -DallowMajorUpdates=false -DallowMinorUpdates=true -Dincludes=org.wso2.identity.apps -DincludeProperties=identity.apps.console.version,identity.apps.core.version,identity.apps.myaccount.version
          echo "Checking carbon kernel updates"
          echo "=========================================================="
          CURRENT_KERNEL_VERSION=$(sed -n 's|.*<carbon.kernel.version>\(.*\)</carbon.kernel.version>.*|\1|p' pom.xml | head -1)
          if [ -z "$CURRENT_KERNEL_VERSION" ]; then
            echo "::error::Could not read carbon.kernel.version from pom.xml."
            exit 1
          fi
          KERNEL_VERSION_LINE=${CURRENT_KERNEL_VERSION%.*}
          KERNEL_METADATA=$(curl -fsSL https://maven.wso2.org/nexus/content/groups/public/org/wso2/carbon/org.wso2.carbon.core/maven-metadata.xml)
          LATEST_KERNEL_VERSION=$(printf '%s\n' "$KERNEL_METADATA" \
            | sed -n "s|.*<version>\(${KERNEL_VERSION_LINE//./\\.}\.[0-9][0-9]*\)</version>.*|\1|p" \
            | sort -t. -k3,3n | tail -1)
          if [ -z "$LATEST_KERNEL_VERSION" ]; then
            echo "::error::Could not resolve the latest carbon kernel version on the ${KERNEL_VERSION_LINE} line."
            exit 1
          fi
          NEWEST_KERNEL_VERSION=$(printf '%s\n%s\n' "$CURRENT_KERNEL_VERSION" "$LATEST_KERNEL_VERSION" | sort -t. -k3,3n | tail -1)
          if [ "$NEWEST_KERNEL_VERSION" != "$CURRENT_KERNEL_VERSION" ]; then
            sed -i "s|<carbon.kernel.version>${CURRENT_KERNEL_VERSION}</carbon.kernel.version>|<carbon.kernel.version>${LATEST_KERNEL_VERSION}</carbon.kernel.version>|" pom.xml
            sed -i "s|version=\"${CURRENT_KERNEL_VERSION}\"|version=\"${LATEST_KERNEL_VERSION}\"|g" modules/p2-profile-gen/carbon.product
            echo "Bumped carbon kernel version: ${CURRENT_KERNEL_VERSION} -> ${LATEST_KERNEL_VERSION}"
          else
            echo "Carbon kernel version is up to date: ${CURRENT_KERNEL_VERSION}"
          fi
          echo "Available updates"
          echo "=========================================================="
          git diff --color > dependency_updates.diff
          cat dependency_updates.diff

      - name: Build
        working-directory: ${{ env.REPOSITORY }}
        run: |
          echo "Building project"
          echo "=========================================================="
          mvn clean install -DskipTests | tee mvn-build.log
          PR_BUILD_STATUS=$(cat mvn-build.log | grep "\[INFO\] BUILD" | grep -oE '[^ ]+$')
          PR_BUILD_FINAL_RESULT=$(
            echo "==========================================================="
            echo "product-is BUILD $PR_BUILD_STATUS"
            echo "=========================================================="
          )
          PR_BUILD_RESULT_LOG_TEMP=$(echo "$PR_BUILD_FINAL_RESULT" | sed 's/$/%0A/')
          PR_BUILD_RESULT_LOG=$(echo $PR_BUILD_RESULT_LOG_TEMP)
          echo "::warning::$PR_BUILD_RESULT_LOG"
          PR_BUILD_SUCCESS_COUNT=$(grep -o -i "\[INFO\] BUILD SUCCESS" mvn-build.log | wc -l)
          if [ "$PR_BUILD_SUCCESS_COUNT" != "1" ]; then
            echo "PR BUILD not successfull. Aborting."
            echo "::error::PR BUILD not successfull. Check artifacts for logs."
            exit 1
          fi

      - name: Run Integration Tests
        working-directory: ${{ env.REPOSITORY }}
        run: |
          echo "Running integration tests"
          echo "=========================================================="
          cd modules/integration/tests-integration/tests-backend
          mvn clean install -Dmaven.test.failure.ignore=false | tee mvn-test.log
          PR_TEST_STATUS=$(cat mvn-test.log | grep "\[INFO\] BUILD" | grep -oE '[^ ]+$')
          PR_TEST_RESULT=$(sed -n -e '/\[INFO\] Results:/,/\[INFO\] Tests run:/ p' mvn-test.log)
          PR_BUILD_FINAL_RESULT=$(
            echo "==========================================================="
            echo "product-is TESTS $PR_TEST_STATUS"
            echo "=========================================================="
            echo ""
            echo "$PR_TEST_RESULT"
          )
          PR_BUILD_RESULT_LOG_TEMP=$(echo "$PR_BUILD_FINAL_RESULT" | sed 's/$/%0A/')
          PR_BUILD_RESULT_LOG=$(echo $PR_BUILD_RESULT_LOG_TEMP)
          echo "::warning::$PR_BUILD_RESULT_LOG"
          PR_TEST_SUCCESS_COUNT=$(grep -o -i "\[INFO\] BUILD SUCCESS" mvn-test.log | wc -l)
          if [ "$PR_TEST_SUCCESS_COUNT" != "17" ]; then
            echo "Integration tests not successfull. Aborting."
            echo "::error::Integration tests not successfull. Check artifacts for logs."
            exit 1
          fi

      - name: Commit and Push Changes
        working-directory: ${{ env.REPOSITORY }}
        run: |
          if [ -s dependency_updates.diff ]; then
            echo "Committing changes"
            echo "=========================================================="
            git config --global user.email ${{ env.GIT_EMAIL }}
            git config --global user.name ${{ env.GIT_USERNAME }}
            git commit -a -m 'Bump dependencies (next branch) from '${{ env.DEPENDENCY_UPGRADE_BRANCH_NAME }}
            git remote rm origin
            git remote add origin 'https://'${{ secrets.PAT }}'@github.com/'${{ env.PRODUCT_REPOSITORY_FORKED }}
            echo "Pushing changes"
            echo "=========================================================="
            git push -u origin ${{ env.DEPENDENCY_UPGRADE_BRANCH_NAME }}
          else
            echo "There are no dependency updates available"
            echo "=========================================================="
            exit 0
          fi

      - name: Send Pull Request
        working-directory: ${{ env.REPOSITORY }}
        run: |
          if [ -s dependency_updates.diff ]; then
            echo "Sending Pull Request"
            echo "=========================================================="
            TITLE="[Next Branch] Bump Dependencies #"${{ env.BUILD_NUMBER }}
            RESPONSE=$(curl -s -w "%{http_code}" -k -X \
            POST https://api.github.com/repos/${{ env.PRODUCT_REPOSITORY_PUBLIC }}/pulls \
            -H "Authorization: Bearer "${{ secrets.PAT }}"" \
            -H "Content-Type: application/json" \
            -d '{ "title": "'"${TITLE}"'","body": "Bumps dependencies for product-is next branch. Link : https://github.com/wso2/product-is/actions/runs/${{github.run_id}}","head": "'"${{ env.GIT_USERNAME }}:${{ env.DEPENDENCY_UPGRADE_BRANCH_NAME }}"'","base":"next"}')
            RESPONSE_BODY=${RESPONSE::-3}
            STATUS=$(printf "%s" "$RESPONSE" | tail -c 3)
            if [[ $STATUS == "201" ]]; then
              echo "PR=$(echo $RESPONSE_BODY | jq -r '.html_url')" >> $GITHUB_ENV
            fi
          fi
      - name: Archive dependency diff file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-updates-diff
          path: |
            ${{steps.builder_step.outputs.REPO_NAME}}/dependency_updates.diff
      - name: Archive maven-build-log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvn-build.log
          path: |
            ${{steps.builder_step.outputs.REPO_NAME}}/mvn-build.log
          if-no-files-found: warn
      - name: Archive maven-test-log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvn-test.log
          path: |
            ${{steps.builder_step.outputs.REPO_NAME}}/modules/integration/tests-integration/tests-backend/mvn-test.log
          if-no-files-found: warn
      - name: Archive heap dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heap-dump
          path: |
            **/**.hprof
          if-no-files-found: ignore
      - name: Google Chat Notification
        run: |
          STATUS_COLOR=$(if [[ ${{ job.status }} == "success" ]];then echo "#009944";
          elif [[ ${{ job.status }} = "failure" ]];then echo "#ff0000";
          elif [[ ${{ job.status }} = "cancelled" ]];then echo "#ffc300"; fi)

          curl --location --request POST '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' \
          --header 'Content-Type: application/json' \
          --data-raw '{
              "cards": [
                  {
                      "header": {
                          "title": "Dependency Updater (Next Branch)",
                          "subtitle": "GitHub Action #${{ env.BUILD_NUMBER }}"
                      },
                      "sections": [
                          {
                              "widgets": [
                                  {
                                      "textParagraph": {
                                          "text": "Status: <br><b><font color='"${STATUS_COLOR}"'>${{ job.status }}</font></b></br>"
                                      }
                                  },
                                  {
                                      "keyValue": {
                                          "topLabel": "Build Job:",
                                          "content": "GitHub Action",
                                          "contentMultiline": "false",
                                          "bottomLabel": "",
                                          "button": {
                                              "textButton": {
                                                  "text": "VIEW",
                                                  "onClick": {
                                                      "openLink": {
                                                          "url": "https://github.com/wso2/product-is/actions/runs/${{github.run_id}}"
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  },
                                  {
                                      "keyValue": {
                                          "topLabel": "Pull Request:",
                                          "content": "Check Pull Request",
                                          "contentMultiline": "false",
                                          "bottomLabel": "",
                                          "button": {
                                              "textButton": {
                                                  "text": "VIEW",
                                                  "onClick": {
                                                      "openLink": {
                                                          "url": "'${{ env.PR }}'"
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              ]
                          }
                      ]
                  }
              ]
          }'
        if: always()

# Integration test lanes, run in parallel by TestLaneRunner during "mvn install".
# One line per lane: <lane-name>: <comma-separated testng.xml <test> block names>
# Each lane runs in its own JVM with its own IS server, and all its ports are shifted by 1000 x lane index.
# is-tests-initialize always runs and is not listed here.
# Balanced from CI timings of 2026-11-24 (minutes): each lane holds about 26 min of tests.
lane1: is-tests-with-individual-configuration-changes,is-test-rest-api-2
lane2: is-tests-with-individual-configuration-changes-2,is-test-rest-api,is-tests-oid4vp,is-tests-jdbc-userstore
lane3: is-tests-default-configuration-parallel,is-tests-default-configuration,is-tests-federation,is-tests-federation-restart,is-tests-scim2-parallel,is-tests-scim2,is-test-webhooks,is-tests-connection-sharing
lane4: is-test-adaptive-authentication,is-test-adaptive-authentication-nashorn,is-test-adaptive-authentication-nashorn-with-restart,is-tests-read-only-userstore,is-test-session-mgt,is-tests-uuid-user-store,is-tests-password-update-api,is-tests-oauth-client-secrets-parallel,is-tests-oauth-client-secrets,is-tests-default-configuration-ldap,is-tests-email-username,is-tests-saml-query-profile,is-tests-oauth-jwt-token-gen-enabled,is-tests-default-encryption

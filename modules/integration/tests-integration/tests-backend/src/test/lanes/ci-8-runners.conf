# Integration test layout for CI with 8 runners (wso2/product-is GitHub Actions, 4 cores / 7.8 GB each), testing a
# pack built once by another job. Each runner runs one [section] (-Dlanes.runner=runnerN) as one lane. The whole
# file is validated together, so every block runs exactly once in each user mode.
# Minutes are measured on these runners (run 45960128037); each runner has ~13-15 min of tests.

[runner1]
config-2: is-tests-with-individual-configuration-changes-2,is-tests-email-username,is-tests-default-configuration-ldap

[runner2]
rest-api-2: is-test-rest-api-2,is-tests-oauth-client-secrets-parallel,is-tests-oauth-client-secrets,is-tests-scim2-parallel,is-tests-scim2

[runner3]
default-config: is-tests-default-configuration-parallel,is-tests-default-configuration,is-tests-saml-query-profile,is-tests-oauth-jwt-token-gen-enabled,is-tests-jdbc-userstore

[runner4]
config-4: is-tests-with-individual-configuration-changes-4,is-test-adaptive-authentication,is-tests-connection-sharing,is-tests-default-encryption,is-tests-oid4vp

[runner5]
config-1: is-tests-with-individual-configuration-changes,is-tests-read-only-userstore,is-test-webhooks

[runner6]
rest-api: is-test-rest-api,is-test-session-mgt,is-tests-password-update-api

[runner7]
config-3: is-tests-with-individual-configuration-changes-3,is-test-adaptive-authentication-nashorn,is-test-adaptive-authentication-nashorn-with-restart

[runner8]
federation: is-tests-federation,is-tests-default-configuration-multi-server,is-tests-federation-restart,is-tests-uuid-user-store

# Integration test layout for CI with 4 runners of 4 cores / 7.8 GB each (wso2/product-is GitHub Actions).
# Each runner runs one [section] (-Dlanes.runner=runnerN): two lanes at a time (two IS servers), with test JVMs at
# 1 GB. Blocks that start extra IS servers (federation, the multi-server default-configuration classes) run alone
# first (stage 1); the runner's two lanes follow (~2). The whole file is validated together, so every block runs
# exactly once in each user mode.
# Minutes are measured on these runners with one lane (run 45960128037); two lanes share 4 cores, so each is
# expected to run ~1.3x slower. Target: ~20 min of tests per runner.

[runner1]
federation: is-tests-federation,is-tests-default-configuration-multi-server
config-3~2: is-tests-with-individual-configuration-changes-3
user-stores~2: is-tests-read-only-userstore,is-test-session-mgt,is-tests-uuid-user-store

[runner2]
federation-restart: is-tests-federation-restart
config-1~2: is-tests-with-individual-configuration-changes,is-tests-default-configuration-ldap
rest-api~2: is-test-rest-api,is-tests-email-username

[runner3]
config-2: is-tests-with-individual-configuration-changes-2,is-tests-password-update-api,is-test-adaptive-authentication
rest-api-2: is-test-rest-api-2,is-tests-oauth-client-secrets-parallel,is-tests-oauth-client-secrets,is-tests-scim2-parallel,is-tests-scim2,is-tests-connection-sharing

[runner4]
config-4: is-tests-with-individual-configuration-changes-4,is-test-adaptive-authentication-nashorn,is-test-adaptive-authentication-nashorn-with-restart
default-config: is-tests-default-configuration-parallel,is-tests-default-configuration,is-tests-saml-query-profile,is-tests-oauth-jwt-token-gen-enabled,is-tests-jdbc-userstore,is-tests-default-encryption,is-tests-oid4vp,is-test-webhooks

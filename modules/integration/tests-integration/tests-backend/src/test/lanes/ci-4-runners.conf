# Integration test layout for CI with 4 runners of 4 cores / 7.8 GB each (wso2/product-is GitHub Actions).
# Each runner runs one [section] (-Dlanes.runner=runnerN). The whole file is validated together, so every block
# still runs exactly once in each user mode. A runner never runs two heavy lanes at the same time: its memory
# only fits one IS server lane, or one shared server with a super-tenant and a tenant JVM.
# Estimates from CI block timings on these runners (minutes); each runner ~26-27 min of tests.

[runner1]
# rest-api on one shared server: super-tenant and tenant runs in parallel (~15.5), then federation (~11.8).
api-super@rest(SUPER_TENANT_ADMIN): is-test-rest-api,is-test-rest-api-2
api-tenant@rest(TENANT_ADMIN): is-test-rest-api,is-test-rest-api-2
federation~2: is-tests-federation,is-tests-federation-restart

[runner2]
config-a: is-tests-with-individual-configuration-changes,is-test-adaptive-authentication-nashorn,is-test-adaptive-authentication-nashorn-with-restart,is-tests-read-only-userstore

[runner3]
config-b: is-tests-with-individual-configuration-changes-2,is-test-session-mgt,is-tests-uuid-user-store,is-tests-password-update-api,is-test-adaptive-authentication

[runner4]
default-config: is-tests-default-configuration-parallel,is-tests-default-configuration,is-tests-oauth-client-secrets-parallel,is-tests-oauth-client-secrets,is-tests-default-configuration-ldap,is-tests-email-username,is-tests-connection-sharing,is-tests-scim2-parallel,is-tests-scim2,is-tests-saml-query-profile,is-tests-oauth-jwt-token-gen-enabled,is-tests-jdbc-userstore,is-tests-default-encryption,is-tests-oid4vp,is-test-webhooks
